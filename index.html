<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ワルツのボール</title>

<style>

/* =========================
   全体
========================= */

* {
  box-sizing: border-box;
}

html,


body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background-color: #fffaf0;
  font-family: sans-serif;
  text-align: center;
}

button {
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}


/* =========================
   練習画面
========================= */

#practiceScreen {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
}

#practiceScreen h1 {
  margin: 18px 0 10px;
  font-size: clamp(28px, 3vw, 40px);
}

#startButton,
#numberButton,
#gameButton {
  font-size: clamp(14px, 1.5vw, 18px);
  padding: 7px 12px;
  margin: 0 2px;
}


/* 練習画面の風景部分 */

.game-area {
  position: relative;
  width: 100%;
  height: calc(100dvh - 125px);
  min-height: 0;
  margin-top: 8px;
  overflow: hidden;
}


/* 空 */

.sky {
  position: absolute;
  inset: 0;

  background: linear-gradient(
    to bottom,
    #bfe8f7 0%,
    #e7f6fb 75%,
    #f8f4e8 100%
  );

  overflow: hidden;
  z-index: 0;
}


/* 雲 */

.cloud {
  position: absolute;
  width: 90px;
  height: 30px;
  background: rgba(255,255,255,0.85);
  border-radius: 50px;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
}

.cloud::before {
  width: 45px;
  height: 45px;
  left: 15px;
  top: -20px;
}

.cloud::after {
  width: 55px;
  height: 55px;
  right: 10px;
  top: -27px;
}

.cloud1 {
  top: 12%;
  left: 8%;
}

.cloud2 {
  top: 18%;
  left: 48%;
  transform: scale(0.75);
}

.cloud3 {
  top: 10%;
  left: 84%;
  transform: scale(0.55);
}


/* 丘 */

.hill {
  position: absolute;
  transform-origin: center bottom;
}

.hillBack {
  width: 125%;
  height: 36%;
  left: -15%;
  bottom: 38px;

  background: #b9d8a5;
  border-radius: 50% 55% 0 0 / 45% 45% 0 0;

  z-index: 1;
}

.hillFront {
  width: 135%;
  height: 29%;
  left: -8%;
  bottom: 38px;

  background: #8fbd7c;
  border-radius: 55% 45% 0 0 / 55% 50% 0 0;

  z-index: 2;
}


/* 木・花 */

.scenery-track {
  position: absolute;
  left: 0;
  bottom: 45px;

  display: flex;
  width: 200%;
  height: 70px;

  z-index: 3;

  animation: scroll 10s linear infinite;
  animation-play-state: paused;
}

.scenery {
  width: 50%;
  flex-shrink: 0;

  display: flex;
  justify-content: space-around;
  align-items: flex-end;

  font-size: clamp(28px, 3vw, 42px);
  white-space: nowrap;
}

@keyframes scroll {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}


/* 地面 */

.ground {
  position: absolute;
  left: 0;
  bottom: 38px;

  width: 100%;
  height: 7px;

  background-color: #555;
  z-index: 6;
}


/* ボール */

.ball {
  position: absolute;

  width: clamp(65px, 7vw, 90px);
  height: clamp(65px, 7vw, 90px);

  left: 50%;
  bottom: 42px;

  transform: translateX(-50%);

  border-radius: 50%;
  background-color: #f4a261;

  z-index: 10;
}


/* 拍の数字 */

#beatNumber {
  position: absolute;

  left: 50%;
  top: 18%;

  transform: translateX(-50%);

  font-size: clamp(65px, 8vw, 100px);
  font-weight: bold;

  z-index: 20;
}


/* =========================
   ゲーム画面
========================= */

#gameScreen {
  display: none;

  position: relative;

  width: 100%;
  height: 100dvh;
  min-height: 0;

  padding: 12px 15px;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 13% 20%,
      rgba(255,255,255,0.9) 0 34px,
      transparent 36px
    ),

    radial-gradient(
      ellipse at 84% 25%,
      rgba(255,255,255,0.8) 0 27px,
      transparent 29px
    ),

    radial-gradient(
      ellipse 80% 30% at 65% 108%,
      #a9cf91 0%,
      #a9cf91 99%,
      transparent 100%
    ),

    radial-gradient(
      ellipse 85% 27% at 25% 103%,
      #c5dfae 0%,
      #c5dfae 99%,
      transparent 100%
    ),

    linear-gradient(
      to bottom,
      #cceefa 0%,
      #e8f7fb 100%
    );
}


/* ゲーム画面の文字 */

#gameScreen h1 {
  position: relative;
  z-index: 2;

  margin: 5px 0 8px;

  font-size: clamp(27px, 3.2vw, 40px);
}

#gameScreen p {
  position: relative;
  z-index: 2;

  margin: 4px 0 8px;

  font-size: clamp(16px, 2vw, 24px);
  line-height: 1.35;
}


/* ゲームスタート */

#gameStartButton {
  position: relative;
  z-index: 20;

  margin-top: 3px;

  padding: 8px 15px;

  font-size: clamp(15px, 1.6vw, 18px);
}


/* 「ここ！」ボタン */

#catchButton {
  position: relative;
  z-index: 100;

  width: clamp(105px, 12vw, 150px);
  height: clamp(105px, 12vw, 150px);

  margin-top: 4px;

  border: none;
  border-radius: 50%;

  background: #f7a35c;

  font-size: clamp(20px, 2vw, 26px);
  font-weight: bold;
  color: #222;

  box-shadow: 0 7px 0 #d9823f;

  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

#catchButton:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 #d9823f;
}

#catchButton:focus {
  outline: none;
}


/* 結果 */

#result {
  position: relative;
  z-index: 2;

  height: clamp(38px, 6vh, 65px);

  margin-top: 8px;

  font-size: clamp(25px, 3vw, 40px);
  font-weight: bold;
}

#score {
  position: relative;
  z-index: 2;

  margin-top: 2px;

  font-size: clamp(17px, 2vw, 24px);
}

.correctCircle {
  color: #000;
}

.wrongCircle {
  color: #c8c8c8;
}

.emptyCircle {
  color: #000;
}


/* 正解アニメーション */

.correct-pop {
  animation: correctPop 0.5s ease;
}

@keyframes correctPop {

  0% {
    transform: scale(0.7);
    opacity: 0;
  }

  50% {
    transform: scale(1.3);
    opacity: 1;
  }

  75% {
    transform: scale(0.9);
  }

  100% {
    transform: scale(1);
  }
}


/* =========================
   テンポ
========================= */

.tempo-control {
  position: absolute;

  left: 20px;
  bottom: 130px;

  display: flex;
  align-items: center;
  gap: 6px;

  z-index: 20;
}

.tempo-control span {
  margin-right: 3px;
  font-weight: bold;
  font-size: clamp(13px, 1.4vw, 16px);
}

.tempo-button {
  padding: 6px 10px;

  font-size: clamp(13px, 1.4vw, 16px);

  border: 1px solid #aaa;
  border-radius: 10px;

  background: white;
}

.tempo-button.selected {
  background: #ffd59e;
  border: 2px solid #f4a259;
}


/* 戻る */

#backButton {
  position: absolute;

  right: 20px;
  bottom: 130px;

  z-index: 20;

  padding: 8px 14px;

  font-size: clamp(14px, 1.5vw, 18px);
}


/* =========================
   ゲーム画面の飾り
========================= */

.game-decoration {
  position: absolute !important;

  inset: 0;

  z-index: 0 !important;

  pointer-events: none;
}

.game-decoration span {
  position: absolute;
  font-size: clamp(25px, 3vw, 34px);
}

.tree1 {
  left: 10%;
  bottom: 8%;
}

.flower1 {
  left: 27%;
  bottom: 5%;
}

.flower2 {
  right: 27%;
  bottom: 6%;
}

.tree2 {
  right: 10%;
  bottom: 9%;
}


/* =========================
   高さが低い横画面
   Mac小窓・iPad横・iPhone横
========================= */

@media (orientation: landscape) and (max-height: 700px) {

  #practiceScreen h1 {
    margin: 7px 0 5px;
    font-size: 28px;
  }

  #startButton,
  #numberButton,
  #gameButton {
    padding: 5px 9px;
    font-size: 14px;
  }

  .game-area {
    height: calc(100dvh - 92px);
    margin-top: 5px;
  }

  .ball {
    width: 70px;
    height: 70px;
    bottom: 38px;
  }

  #beatNumber {
    top: 15%;
    font-size: 70px;
  }


  /* ゲーム画面 */

  #gameScreen {
    padding-top: 5px;
  }

  #gameScreen h1 {
    margin: 0 0 3px;
    font-size: 27px;
  }

  #gameScreen p {
    margin: 2px 0 4px;
    font-size: 16px;
    line-height: 1.2;
  }

  #gameStartButton {
    padding: 5px 10px;
    font-size: 14px;
  }

  #gameScreen br {
    line-height: 0.3;
  }

  #catchButton {
    width: 95px;
    height: 95px;

    margin-top: 0;

    font-size: 19px;
  }

  #result {
    height: 32px;
    margin-top: 5px;
    font-size: 23px;
  }

  #score {
    margin-top: 0;
    font-size: 16px;
  }

  .tempo-control {
    left: 10px;
    bottom: 8px;
    gap: 4px;
  }

  .tempo-control span {
    font-size: 12px;
  }

  .tempo-button {
    padding: 4px 6px;
    font-size: 12px;
  }

  #backButton {
    right: 10px;
    bottom: 8px;

    padding: 5px 9px;
    font-size: 13px;
  }

  .game-decoration span {
    font-size: 25px;
  }
}


/* =========================
   縦向きスマートフォン
========================= */

@media (orientation: portrait) and (max-width: 600px) {

  html,
  body {
    height: auto;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  #practiceScreen,
  #gameScreen {
    min-height: 100dvh;
    height: auto;
  }

  #practiceScreen h1 {
    font-size: 28px;
  }

  .game-area {
    height: 520px;
  }

  #gameScreen {
    padding-top: 25px;
    min-height: 100dvh;
  }

  #gameScreen h1 {
    font-size: 29px;
  }

  #gameScreen p {
    font-size: 17px;
  }

  #catchButton {
    width: 120px;
    height: 120px;
  }

  .tempo-control {
    position: relative;

    left: auto;
    bottom: auto;

    justify-content: center;

    margin: 15px auto 70px;
  }

  #backButton {
    position: relative;

    right: auto;
    bottom: auto;

    margin-bottom: 25px;
  }
}


/* 飾りはタップを邪魔しない */

#gameScreen::before,
#gameScreen::after,
.game-decoration {
  pointer-events: none;
}

/* Mac・iPad横画面は必ず1画面に収める */
@media (orientation: landscape) {

  html,
  body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  #practiceScreen,
  #gameScreen {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
  }
}

</style>

  </head>


<body>

<div id="practiceScreen">

  <h1>ワルツのボール</h1>

  <button id="startButton">▶ スタート</button>
  <button id="numberButton">123をかくす</button>
  <button id="gameButton">ゲームにすすむ →</button>

  <div class="game-area">

  <!-- 空と雲 -->
  <div class="sky">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <!-- 丘 -->
  <div class="hill hillBack"></div>
  <div class="hill hillFront"></div>

  <!-- 木と花 -->
<div class="scenery-track">

  <div class="scenery">
    <span>🌳</span>
    <span>🌷</span>
    <span>🌳</span>
    <span>🌼</span>
    <span>🌳</span>
    <span>🌷</span>
    <span>🌳</span>
  </div>

  <div class="scenery">
    <span>🌳</span>
    <span>🌷</span>
    <span>🌳</span>
    <span>🌼</span>
    <span>🌳</span>
    <span>🌷</span>
    <span>🌳</span>
  </div>

</div>

  <!-- ボール -->
  <div class="ball"></div>

  <!-- 1・2・3 -->
  <div id="beatNumber"></div>

  <!-- 地面 -->
  <div class="ground"></div>

</div>
</div>

<div id="gameScreen">

  <h1>1拍目をつかまえよう！</h1>

  <p>音をよく聞いて、「1」だと思ったところで押してね！<br>
  5回チャレンジできるよ！</p>

  <button id="gameStartButton">▶ ゲームスタート</button>


  <button id="catchButton">ここ！</button>

  <div id="result"></div>

  <div id="score"></div>


 <div class="game-decoration">
  <span class="tree tree1">🌳</span>
  <span class="flower flower1">🌷</span>
  <span class="flower flower2">🌼</span>
  <span class="tree tree2">🌳</span>
</div>

  <button id="backButton">← もどる</button>

<div class="tempo-control">
  <span>テンポ</span>
  <button class="tempo-button" data-bpm="55">🐢 ゆっくり</button>
  <button class="tempo-button selected" data-bpm="75">🎵 ふつう</button>
  <button class="tempo-button" data-bpm="100">🐇 はやい</button>
</div>

</div>
  <script>

  const ball = document.querySelector('.ball');
  const startButton = document.querySelector('#startButton');
  const scenery = document.querySelector('.scenery-track');
  const beatNumber = document.querySelector('#beatNumber');
  const numberButton = document.querySelector('#numberButton');
  let showNumbers = true;

　const practiceScreen = document.querySelector('#practiceScreen');
　const gameScreen = document.querySelector('#gameScreen');
　const gameButton = document.querySelector('#gameButton');
　const backButton = document.querySelector('#backButton');

 const gameStartButton = document.querySelector('#gameStartButton');
 const catchButton = document.querySelector('#catchButton');
 const result = document.querySelector('#result');

 let gameBeat = 1;
 let gameTimer;
 let gamePlaying = false;

 let gameBpm = 75;

 let firstBeatTime = 0;

 let challengeCount = 0;
 let correctCount = 0;
 let canCatch = true;
 let challengeResults = [];

 const score = document.querySelector('#score');

  let beat = 1;
  let audioContext;
  let timer;
  let isPlaying = false;

async function prepareAudio() {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    audioContext = new AudioContextClass();
  }

  if (audioContext.state !== 'running') {
    await audioContext.resume();
  }

  // iPhone / iPadで音声を確実に有効にする
  const buffer = audioContext.createBuffer(1, 1, 22050);
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.start(0);
}
  function playSound(isFirstBeat) {

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    const now = audioContext.currentTime;

    oscillator.type = 'sine';

    if (isFirstBeat) {
      // 1拍目：低め・強め
      oscillator.frequency.setValueAtTime(220, now);
      oscillator.frequency.exponentialRampToValueAtTime(140, now + 0.18);

      gain.gain.setValueAtTime(0.35, now);
    } else {
      // 2・3拍目：高め・弱め
      oscillator.frequency.setValueAtTime(300, now);
      oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.12);

      gain.gain.setValueAtTime(0.15, now);
    }

    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

    oscillator.start(now);
    oscillator.stop(now + 0.2);
  }


  function bounce() {

    if (showNumbers) {
     beatNumber.textContent = beat;
   } else {
     beatNumber.textContent = '';
   }
    
    if (beat === 1) {
     beatNumber.style.fontSize = '100px';
    } else {
     beatNumber.style.fontSize = '70px';
    }

    let height;

    if (beat === 3) {
      height = 190;   // 3拍目から次の1拍目へ大きく跳ぶ
    } else {
      height = 100;   // 1・2拍目は小さく
    }

    playSound(beat === 1);

    ball.animate(
      [
        {
          transform: 'translateX(-50%) translateY(0)'
        },

        {
          transform: `translateX(-47%) translateY(-${height}px)`
        },

        {
          transform: 'translateX(-50%) translateY(0)'
        }
      ],
      {
        duration: 780,
        easing: 'ease-in-out'
      }
    );

    beat++;

    if (beat > 3) {
      beat = 1;
    }
  }


  startButton.addEventListener('click', async () => {

    if (isPlaying) {
      clearInterval(timer);
      isPlaying = false;

      scenery.style.animationPlayState = 'paused';

      beatNumber.textContent = '';

      startButton.textContent = '▶ スタート';
      return;

    }

    await prepareAudio();

    beat = 1;
    isPlaying = true;

    scenery.style.animationPlayState = 'running';

    bounce();

    timer = setInterval(bounce, 800);

    startButton.textContent = '■ ストップ';

  });

numberButton.addEventListener('click', () => {

  showNumbers = !showNumbers;

  if (showNumbers) {
    numberButton.textContent = '123をかくす';
  } else {
    beatNumber.textContent = '';
    numberButton.textContent = '123を表示';
  }

});

gameButton.addEventListener('click', () => {

  // 練習を停止
  if (isPlaying) {
    clearInterval(timer);
    isPlaying = false;
    scenery.style.animationPlayState = 'paused';
    startButton.textContent = '▶ スタート';
  }

  practiceScreen.style.display = 'none';
  gameScreen.style.display = 'block';

});


backButton.addEventListener('click', () => {

  // ゲームの音を停止
  if (gamePlaying) {
    clearInterval(gameTimer);
    gamePlaying = false;
    gameStartButton.textContent = '▶ ゲームスタート';
  }

  // 練習画面へ戻る
  gameScreen.style.display = 'none';
  practiceScreen.style.display = 'block';

});

function gameSound(isFirstBeat) {

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  const now = audioContext.currentTime;

  oscillator.type = 'sine';

  if (isFirstBeat) {

    oscillator.frequency.setValueAtTime(220, now);
    oscillator.frequency.exponentialRampToValueAtTime(140, now + 0.18);

    gain.gain.setValueAtTime(0.35, now);

  } else {

    oscillator.frequency.setValueAtTime(300, now);
    oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.12);

    gain.gain.setValueAtTime(0.15, now);
  }

  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

  oscillator.start(now);
  oscillator.stop(now + 0.2);
}


function gameBeatPlay() {

  

  if (gameBeat === 1) {
    firstBeatTime = performance.now();
  }

  gameSound(gameBeat === 1);

  gameBeat++;

  if (gameBeat > 3) {
    gameBeat = 1;
  }
}


gameStartButton.addEventListener('click', async () => {

  if (gamePlaying) {

    clearInterval(gameTimer);

    gamePlaying = false;

    gameStartButton.textContent = '▶ ゲームスタート';

    return;
  }

  await prepareAudio();

  gameBeat = 1;
  gamePlaying = true;

  challengeCount = 0;
  correctCount = 0;
  challengeResults = [];

  result.textContent = '';

  score.textContent = 'チャレンジ　○ ○ ○ ○ ○　　せいかい 0回';

  gameBeatPlay();

  const interval = 60000 / gameBpm;
  gameTimer = setInterval(gameBeatPlay, interval);

  gameStartButton.textContent = '■ ストップ';

});


catchButton.addEventListener('pointerdown', (event) => {
  event.preventDefault();

  if (!gamePlaying) {
  return;
}

  

  challengeCount++;

  
  const now = performance.now();

const beatDuration = 60000 / gameBpm;

// 1小節（3拍）の長さ
const measureDuration = beatDuration * 3;

// 最後の1拍目から何msたったか
const timeFromFirstBeat = now - firstBeatTime;

// 次の1拍目まであと何msか
const timeToNextFirstBeat =
  measureDuration - timeFromFirstBeat;

// 正解範囲
const correctWindow = beatDuration * 0.45;

// 1拍目の直後 または 次の1拍目の直前なら正解
const isCorrect =
  timeFromFirstBeat <= correctWindow ||
  timeToNextFirstBeat <= correctWindow;

if (isCorrect) {
  correctCount++;
  challengeResults.push(true);
  result.textContent = "✨ せいかい！ ✨";

result.classList.remove("correct-pop");
void result.offsetWidth;
result.classList.add("correct-pop");

} else {
  challengeResults.push(false);
  result.textContent = 'おしい！';
}

  let circles = '';

challengeResults.forEach(isCorrect => {
  if (isCorrect) {
    circles += '<span class="correctCircle">●</span> ';
  } else {
    circles += '<span class="wrongCircle">●</span> ';
  }
});

for (let i = challengeCount; i < 5; i++) {
  circles += '<span class="emptyCircle">○</span> ';
}

score.innerHTML =
  'チャレンジ　' + circles + '　せいかい ' + correctCount + '回';

  if (challengeCount >= 5) {

  // これ以上タップしても判定しない
  gamePlaying = false;

  if (isCorrect) {

    // 正解なら、今の小節の3拍目まで鳴らしてから止める
    const beatDuration = 60000 / gameBpm;

    setTimeout(() => {
      clearInterval(gameTimer);

      if (correctCount === 5) {
        result.textContent = '🎉 ぜんぶせいかい！';
      } else {
        result.textContent = 'できた！　' + correctCount + 'もんせいかい！';
      }

      gameStartButton.textContent = '▶ もういちど';

    }, beatDuration * 2.2);

  } else {

    // 不正解なら今まで通り止める
    clearInterval(gameTimer);

    result.textContent =
      'できた！　' + correctCount + 'もんせいかい！';

    gameStartButton.textContent = '▶ もういちど';
  }
}
});

const tempoButtons = document.querySelectorAll('.tempo-button');

tempoButtons.forEach(button => {
  button.addEventListener('click', () => {

    // 選んだテンポを保存
    gameBpm = Number(button.dataset.bpm);

    // ボタンの色を切り替える
    tempoButtons.forEach(btn => {
      btn.classList.remove('selected');
    });

    button.classList.add('selected');

    // ゲーム再生中なら、すぐ新しいテンポに変更
    if (gamePlaying) {
      clearInterval(gameTimer);

      const interval = 60000 / gameBpm;
      gameTimer = setInterval(gameBeatPlay, interval);
    }
  });
});

</script>
</body>

</html>
